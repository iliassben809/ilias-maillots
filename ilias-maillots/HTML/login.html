<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — ILIAS & LAHCEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/login.css">
    <link rel="icon" href="../images/se-connecter.png" type="image/png">
</head>
<body>
    <div class="login-wrap">

        <div class="login-brand">
            <div class="login-brand-name">ILIAS&<span>LAHCEN</span></div>
            <div class="login-brand-sub">Gestion de Stock · Maillots Premium</div>
        </div>

        <div class="login-card">
            <h2>Se <em>connecter</em></h2>
            <p class="login-subtitle">Entrez vos identifiants pour accéder à votre espace</p>

            <div class="form-group">
                <label for="user">Nom d'utilisateur</label>
                <input type="text" id="user" placeholder="Entrez votre nom">
            </div>

            <div class="form-group">
                <label for="pass">Mot de passe</label>
                <input type="password" id="pass" placeholder="••••••••">
            </div>

            <button class="btn-login" onclick="validerConnexion()">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                    <polyline points="10 17 15 12 10 7"/>
                    <line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
                Se connecter
            </button>

            <p id="err" class="error">Identifiants incorrects !</p>

            <div class="footer-info">
                <p>Admin : <b>admin</b> / <b>admin123</b></p>
                <p>Client : <b>client</b> / <b>client123</b></p>
            </div>
        </div>

    </div>

    <script>
        function validerConnexion() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value;
            const err = document.getElementById('err');

            err.style.display = 'none';

            if (u === 'admin' && p === 'admin123') {
                window.location.href = 'admin.html';
            } else if (u === 'client' && p === 'client123') {
                window.location.href = 'client.html';
            } else {
                err.style.display = 'block';
            }
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') validerConnexion();
        });
    </script>
</body>
</html>
